[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dreep-mcp"
dynamic = ["version"]
description = "The official Dreep MCP server: let any AI agent upload, transform, convert, OCR and deliver media through Dreep."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Dreep" }]
keywords = ["dreep", "mcp", "model-context-protocol", "ai", "agents", "media", "cdn", "image", "ocr"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = ["dreep>=0.1.1,<0.2", "mcp>=2.3,<3", "uvicorn>=0.30"]

[project.scripts]
dreep-mcp = "dreep_mcp._cli:main"

[project.urls]
Homepage = "https://dreep.cloud"
Documentation = "https://docs.dreep.cloud"
Repository = "https://github.com/IndigoSoftwares21/dreep-mcp"
Issues = "https://github.com/IndigoSoftwares21/dreep-mcp/issues"
Changelog = "https://github.com/IndigoSoftwares21/dreep-mcp/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.8", "mypy>=1.13", "anyio>=4"]

[tool.hatch.version]
path = "src/dreep_mcp/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/dreep_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/dreep_mcp", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

# --------------------------------------------------------------------------- #
# Lint and format
# --------------------------------------------------------------------------- #

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF", "S", "N", "PL", "PT", "RET",
  "ARG", "PIE", "T20", "TID", "PTH", "PERF", "FBT003",
]
ignore = [
  "PLR0913",  # tools mirror the SDK method's parameters, keyword-only
  "PLR2004",  # magic values are enforced by scripts/rules (no-magic-strings)
  "S101",     # asserts narrow types; tests use them
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S603", "ARG", "PLR0915", "SIM117", "FBT003"]
"scripts/**" = ["T20", "S603", "S607"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

# --------------------------------------------------------------------------- #
# Types
# --------------------------------------------------------------------------- #

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "scripts"]

# --------------------------------------------------------------------------- #
# Tests
# --------------------------------------------------------------------------- #

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["dreep_mcp"]
branch = true
omit = ["*/dreep_mcp/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
exclude_also = ["if TYPE_CHECKING:", "raise AssertionError", "@overload", "if __name__ == .__main__.:"]
